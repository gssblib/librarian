<mat-card appearance="outlined">
  <form name="form" (ngSubmit)="f.form.valid && login()" #f="ngForm" novalidate>
    <h2>Login</h2>
    <div>
      @switch (type) {
        @case ('sycamore') {
          <p>Please use your Sycamore credentials to log in.</p>
        }
        @case ('internal') {
          <p>Please use your internal credentials to log in.</p>
        }
        @default {
          <p>No idea which credentials you should use. Good luck!</p>
        }
      }
    </div>
    @if (error) {
      <p class="error">
        {{error}}
      </p>
    }
    <mat-form-field appearance="outline">
      <input matInput required [(ngModel)]="model.username" name="username" placeholder="Login" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <input matInput required [(ngModel)]="model.password" type="password"
        name="password"
        placeholder="Password" />
    </mat-form-field>
    <div class="containerX">
      <button mat-raised-button color="primary" [disabled]="loading">Login</button>
      @if (loading) {
        <div class="loading">
          <mat-icon>refresh</mat-icon>
        </div>
      }
    </div>
  </form>
</mat-card>
