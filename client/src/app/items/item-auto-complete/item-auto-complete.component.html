<mat-form-field floatPlaceholder="never" appearance="outline" class="item-autocomplete" (keyup.enter)="selectFirstItem()">
  <input #input matInput size="50" placeholder="Item Title or Barcode"
    [formControl]="itemCtrl" [matAutocomplete]="auto">
</mat-form-field>
<mat-autocomplete #auto="matAutocomplete" [displayWith]="displayWith">
  @for (suggestion of suggestions; track suggestion) {
    <mat-option [value]="suggestion">
      {{ displayWith(suggestion) }}
    </mat-option>
  }
</mat-autocomplete>
